[package]
name = "exodus-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Desktop Mission Control GUI for Project Exodus using Tauri v2"

[[bin]]
name = "exodus-desktop"
path = "src/main.rs"

[dependencies]
exodus-core.workspace = true
exodus-parser.workspace = true
exodus-planner.workspace = true
exodus-store.workspace = true
exodus-verifier.workspace = true
exodus-case.workspace = true
exodus-graph.workspace = true
exodus-agent.workspace = true
exodus-toolchain.workspace = true
exodus-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1.10", features = ["v7"] }
tauri = { version = "2.11" }
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2.1" }
